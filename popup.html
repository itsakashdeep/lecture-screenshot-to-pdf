<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lecture Screenshot to PDF</title>
  <style>
    body {
      width: 240px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .key-section {
      margin-bottom: 15px;
      background: #f4f4f4;
      padding: 10px;
      border-radius: 6px;
    }
    input {
      width: 40px;
      text-align: center;
      font-size: 16px;
      padding: 4px;
      text-transform: uppercase;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #saveKeyBtn {
      background-color: #2196F3;
      color: white;
      margin-top: 6px;
    }
    #concludeBtn {
      background-color: #4CAF50;
      color: white;
    }
  </style>
  <script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
  <h3>Lecture Assistant</h3>

  <div class="key-section">
    <label for="keyInput">Screenshot Key:</label><br>
    <input type="text" id="keyInput" maxlength="1" placeholder="S">
    <button id="saveKeyBtn">Save Key</button>
  </div>

  <div class="status" id="countStatus">Screenshots: 0</div>

  <button id="concludeBtn">Conclude & Download PDF</button>

  <script src="popup.js"></script>
</body>
</html>
